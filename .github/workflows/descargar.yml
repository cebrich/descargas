name: Descargar PDFs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python descargar_pdfs.py
        env:
          S_USER: ${{ secrets.S_USER }}
          S_PASS: ${{ secrets.S_PASS }}
      - name: Subir diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-login
          path: |
            error_*.png
            error_*.html
          if-no-files-found: ignore
      - name: Guardar PDFs nuevos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add descargas
          git diff --staged --quiet || (git commit -m "Nuevos PDFs" && git push)
